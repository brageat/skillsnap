<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2B2E36"/>
      <stop offset="1" stop-color="#16181D"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFD54A"/>
      <stop offset="1" stop-color="#F5A300"/>
    </linearGradient>
    <linearGradient id="bolt" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#FFE7A0"/>
    </linearGradient>
  </defs>

  <!-- app tile -->
  <rect width="256" height="256" rx="58" fill="url(#bg)"/>

  <!-- red rings closing in (motion trail) -->
  <circle cx="128" cy="128" r="104" fill="none" stroke="#F1445A" stroke-width="5" opacity="0.18"/>
  <circle cx="128" cy="128" r="90" fill="none" stroke="#F1445A" stroke-width="6" opacity="0.4"/>

  <!-- yellow target ring with the red ring snapped onto it -->
  <circle cx="128" cy="128" r="66" fill="#1B1D22"/>
  <circle cx="128" cy="128" r="66" fill="none" stroke="url(#gold)" stroke-width="18"/>
  <circle cx="128" cy="128" r="77" fill="none" stroke="#F1445A" stroke-width="6"/>

  <!-- lightning bolt -->
  <path d="M140 74 L100 136 H126 L114 182 L158 114 H131 Z"
        fill="url(#bolt)" stroke="#F5A300" stroke-width="3" stroke-linejoin="round"/>
</svg>
